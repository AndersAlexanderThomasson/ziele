<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0e0f11">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Habits">
<meta name="description" content="Gewohnheiten täglich und wöchentlich abhaken.">
<title>Habits</title>
<style>
:root,html[data-theme="dark"]{
  --bg:#0e0f11;--surface:#16181b;--card:#17191d;--card2:#202328;--line:#262a30;--text:#e9ebee;--muted:#9ba2ac;--faint:#6b727c;
  --empty:#24282e;--accent:#5b9cff;--on-accent:#0b1220;--ok:#34d399;--bad:#f87171;--shadow:0 12px 34px rgba(0,0,0,.5);--overlay:rgba(0,0,0,.6);--oncolor:#0b0c0e;
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#f3f4f6;--surface:#fff;--card:#fff;--card2:#eceef1;--line:#e2e5e9;--text:#15181c;--muted:#5f6873;--faint:#8a929c;
  --empty:#e6e8ec;--accent:#2f6fde;--on-accent:#fff;--ok:#16a34a;--bad:#dc2626;--shadow:0 10px 28px rgba(16,24,40,.18);--overlay:rgba(0,0,0,.35);--oncolor:#fff;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;background:none;border:0;padding:0}
a{color:inherit}
svg{flex:none;width:20px;height:20px}
.wrap{max-width:720px;margin:0 auto}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 12px 8px}
.tr{display:flex;align-items:center;gap:2px}
.ttl{flex:1;min-width:0;padding-left:4px}
.ttl b{display:block;font-size:20px;font-weight:700;letter-spacing:-.01em}
.ttl span{display:block;font-size:12.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{width:42px;height:42px;border-radius:12px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.tb:hover,.tb.on{background:var(--card2);color:var(--text)}
.tb svg{width:22px;height:22px}
#seg{display:flex;background:var(--card2);border-radius:12px;padding:4px;margin-top:10px}
#seg button{flex:1;height:40px;border-radius:9px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
#seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.25)}
#seg i{font-style:normal;font-size:12px;color:var(--faint);font-weight:600}
main{padding:4px 12px calc(110px + env(safe-area-inset-bottom))}
.summary{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 10px;margin:6px 2px 12px;font-size:14px;color:var(--muted)}
.summary b{color:var(--text);font-weight:600}
.bar{grid-column:1/-1;display:block;height:5px;border-radius:9px;background:var(--empty);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .25s}
.cells{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.ghead{position:sticky;top:calc(118px + env(safe-area-inset-top));z-index:5;background:var(--bg);padding:2px 13px 6px}
.gsp{display:none}
.gl{text-align:center;line-height:1.1;color:var(--faint);padding:3px 0;border-radius:8px}
.gl small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em}
.gl b{display:block;font-size:13.5px;font-weight:600;color:var(--muted)}
.gl.now b,.gl.now small{color:var(--text)}
.gl.now{background:var(--card2)}
.list{display:flex;flex-direction:column;gap:8px}
.hrow{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 12px 12px;touch-action:pan-y}
.hrow.dragging{position:fixed;z-index:50;box-shadow:var(--shadow);transform:scale(1.02);opacity:.96;pointer-events:none;border-color:var(--c)}
.ph{border:2px dashed var(--line);border-radius:16px;background:var(--surface)}
.hhead{display:flex;align-items:center;gap:2px;margin:0 0 8px -8px;min-width:0}
.grip{width:34px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--faint);touch-action:none;cursor:grab;border-radius:10px;flex:none}
.grip:hover{color:var(--text);background:var(--card2)}
.grip svg{width:18px;height:18px}
.hname{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;min-height:44px;border-radius:10px;padding:2px 4px}
.hname:hover b{text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px}
.hic{width:38px;height:38px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.hic svg{width:21px;height:21px}
.hic.lg{width:48px;height:48px;border-radius:14px}.hic.lg svg{width:26px;height:26px}
.hic.sm{width:30px;height:30px;border-radius:9px}.hic.sm svg{width:17px;height:17px}
.ht{min-width:0;display:flex;flex-direction:column}
.ht b{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht small{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:3px;white-space:nowrap;overflow:hidden}
.mi{width:13px!important;height:13px!important;vertical-align:-2px;margin-right:2px}
.dot{color:var(--faint);margin:0 2px}
.cell{position:relative;height:40px;border-radius:11px;background:var(--empty);overflow:hidden;display:flex;align-items:center;justify-content:center;transition:transform .08s,background .15s;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.cell:active{transform:scale(.92)}
.cell.now{box-shadow:inset 0 0 0 2px var(--line)}
.cell .fill{position:absolute;left:0;right:0;bottom:0;background:var(--cs);transition:height .2s}
.cell .cn{position:relative;font-size:12px;font-weight:700;color:var(--text)}
.cell .cn.faint{color:var(--faint);font-weight:500;font-size:11px}
.cell.part{box-shadow:inset 0 0 0 2px var(--c)}
.cell.done{background:var(--c)}
.cell.done .cn,.cell.done .ck{color:var(--oncolor)}
.cell .ck{width:20px;height:20px;stroke-width:3}
.hint{color:var(--faint);font-size:12.5px;text-align:center;margin:16px 8px}
.hint .mi{margin:0 2px}
.empty{text-align:center;color:var(--muted);padding:56px 16px}
.empty .big{width:56px;height:56px;color:var(--faint)}
.empty p{font-size:17px;margin:14px 0 22px}
.empty.small{padding:30px 16px;font-size:14.5px}
.fab{position:fixed;right:max(18px,calc(50% - 342px));bottom:calc(22px + env(safe-area-inset-bottom));z-index:30;width:62px;height:62px;border-radius:20px;background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
.fab svg{width:30px;height:30px;stroke-width:2.6}
.fab:active{transform:scale(.94)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 16px;border-radius:12px;background:var(--card2);color:var(--text);font-weight:600;font-size:15px;text-decoration:none;border:1px solid var(--line)}
.btn:hover{filter:brightness(1.08)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.ghost{background:none;border:0;padding:0 8px}
.btn.sm{min-height:38px;padding:0 12px;font-size:13.5px}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.stathead{display:flex;align-items:center;gap:8px;margin:4px 0 12px}
.stats{display:flex;flex-direction:column;gap:8px}
.srow{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.snums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.snums small{display:block;color:var(--faint);font-size:11.5px}
.snums b{font-size:19px}
.snums em{display:block;font-style:normal;font-size:11.5px;color:var(--muted)}
.snums .bar{margin-top:4px}.snums .bar i{background:var(--c)}
#modal{position:fixed;inset:0;z-index:60;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:var(--shadow);animation:up .2s ease-out;overscroll-behavior:contain}
@keyframes up{from{transform:translateY(30px)}to{transform:none}}
@media (min-width:640px){#modal{align-items:center}.sheet{border-radius:22px;max-height:88vh}}
.shtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.shtop h2{font-size:19px;margin:0}
h3{font-size:15px;margin:20px 0 6px}
.lab{display:block;font-size:13px;color:var(--muted);font-weight:600;margin:16px 0 7px}
.preview{display:flex;gap:10px;align-items:center}
.inp{width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px;outline:none}
.inp:focus{border-color:var(--accent)}
.inp.time{width:auto;min-width:110px}
.ta{min-height:240px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;margin-top:8px}
.seg2{display:flex;background:var(--card2);border-radius:12px;padding:4px}
.seg2 button{flex:1;height:40px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg2 button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:46px;height:46px;border-radius:12px;background:var(--card2);display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.stepper input{width:64px;height:46px;text-align:center;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:18px;font-weight:700;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.stepper span{margin-left:4px}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;max-width:360px}
.swatches button{aspect-ratio:1;border-radius:50%;max-width:44px;width:100%;justify-self:center;box-shadow:inset 0 0 0 2px rgba(0,0,0,.12)}
.swatches button.on{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--text)}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.icons button{height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted);border:1.5px solid transparent;background:var(--card)}
.icons button.on{border-width:2px}
.switch{display:flex;align-items:center;gap:12px;cursor:pointer;min-height:44px}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.sw{width:46px;height:28px;border-radius:99px;background:var(--empty);position:relative;flex:none;transition:background .15s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked+.sw{background:var(--accent)}
.switch input:checked+.sw:after{transform:translateX(18px)}
.switch input:focus-visible+.sw{outline:2px solid var(--accent);outline-offset:2px}
.rembox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:6px}
.remline{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.wds{display:flex;gap:4px;flex-wrap:wrap}
.wds button{width:38px;height:38px;border-radius:50%;font-size:13px;font-weight:600;background:var(--card2);color:var(--muted)}
.wds button.on{background:var(--accent);color:var(--on-accent)}
.calbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}
.muted{color:var(--muted)}.small{font-size:13px}.grow{flex:1}
.times{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.trow{display:flex;align-items:center;gap:8px}
.trow .btn{flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:99px;font-size:13px;font-weight:600}
.pill.ok{background:rgba(52,211,153,.15);color:var(--ok)}.pill.bad{background:rgba(248,113,113,.15);color:var(--bad)}
.plain{list-style:none;padding:0;margin:0}
.linkrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:46px;padding:4px;border-radius:10px}
.linkrow:hover{background:var(--card2)}
.stack{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.actions{display:flex;gap:8px;align-items:center;margin-top:22px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:80;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:all .2s;white-space:pre-line}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:640px){
  .topbar{padding-left:20px;padding-right:20px}
  main{padding-left:20px;padding-right:20px}
  .ghead{display:flex;align-items:end}
  .ghead .gsp{display:block;flex:1}
  .ghead .cells{width:calc(7 * 46px + 6 * 6px)}
  .hrow{display:flex;align-items:center;gap:10px;padding:8px 12px}
  .hhead{flex:1;margin:0 0 0 -8px}
  .hrow .cells{width:calc(7 * 46px + 6 * 6px);flex:none}
  .cell{height:44px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="tr">
      <div class="ttl"><b>Habits</b><span id="sub"></span></div>
      <button class="tb" data-action="remind" aria-label="Erinnerungen" title="Erinnerungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg></button>
      <button class="tb" data-action="stats" aria-label="Statistik" title="Statistik"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M8 17v-5M13 17V8M18 17v-9"/></svg></button>
      <button class="tb" data-action="settings" aria-label="Einstellungen" title="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9 7 7M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button>
    </div>
    <div id="seg" role="group" aria-label="Ansicht"><button data-mode="day">Tag <i></i></button><button data-mode="week">Woche <i></i></button></div>
  </header>
  <main id="view"></main>
</div>
<button class="fab" data-action="new" aria-label="Neue Gewohnheit" title="Neue Gewohnheit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script>
"use strict";
(function(){

/* ---------- Symbole (24er-Raster, Kontur) ---------- */
var ICONS = {

  pill:'<path d="m10.5 20.5 10-10a5 5 0 1 0-7-7l-10 10a5 5 0 1 0 7 7ZM8.5 8.5l7 7"/>',

  bed:'<path d="M2 4v16M2 8h18a2 2 0 0 1 2 2v10M2 17h20M6 8v9"/>',

  bulb:'<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2Z"/>',

  chat:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/>',
  code:'<path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/>',
  chart:'<path d="M3 3v18h18M7 14l4-4 4 4 5-5"/>',
  coin:'<circle cx="12" cy="12" r="9"/><path d="M15 9.2a3.5 3.5 0 1 0 0 5.6M7.5 11h5M7.5 13h5"/>',
  briefcase:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',

function icsEsc(s){ return String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n"); }
function icsFold(line){
  var out = [], cur = "", bytes = 0, lim = 75;
  for(var i = 0; i < line.length; i++){
    var ch = line.charAt(i), cp = line.charCodeAt(i);
    if(cp >= 0xD800 && cp <= 0xDBFF && i + 1 < line.length){ ch += line.charAt(++i); }
    var b = unescape(encodeURIComponent(ch)).length;
    if(bytes + b > lim){ out.push(cur); cur = " "; bytes = 1; lim = 75; }

function dueReminders(now){

  function inWin(t){ var m = minutesOf(t); return mins >= m && mins - m < 15; }

  S.settings.dailyTimes.forEach(function(t){
    if(!inWin(t)) return;
    var key = "d|" + t; if(UI.fired[key] === date) return;
    var lines = open.day.map(function(h){ var n = countOf(h.id, date); return "• " + h.title + (h.target > 1 ? " (" + n + "/" + h.target + ")" : ""); })
      .concat(open.week.map(function(h){ var n = countOf(h.id, keyFor(h, date)); return "• " + h.title + " – diese Woche " + n + "/" + h.target; }));

    var k = keyFor(h, date); if(isDone(h, k)) return;

}

  h += '<div class="stack"><button class="btn block" data-action="export">Export als Datei</button>' + (navigator.canShare ? '<button class="btn block" data-action="share">Teilen …</button>' : '') + '<button class="btn block" data-action="import">Datei importieren</button></div>';
  h += '<p class="muted small">Zuletzt exportiert: ' + (S.meta.lastExport ? fmtTs(S.meta.lastExport) : "noch nie") + ' · importiert: ' + (S.meta.lastImport ? fmtTs(S.meta.lastImport) : "noch nie") + '<br>' + nh + ' Gewohnheiten · ' + nc + ' Einträge</p>';
  h += '<h3>Als App installieren</h3><p class="note">Android/Chrome: Menü ⋮ → „Zum Startbildschirm hinzufügen“ bzw. „App installieren“. iPhone/Safari: Teilen → „Zum Home-Bildschirm“. Am Computer: Lesezeichen oder Installieren-Symbol in der Adressleiste.</p>';
  h += '<p class="muted small">Version ' + VERSION + '</p><div class="actions"><span class="grow"></span><button class="btn" data-action="close">Fertig</button></div>';
  openSheet(h);
}
function mentorText(){
  var t = UI.today, L = [];
  L.push("Habit-Tracker – Stand " + fmtDate(t) + " (KW " + kw(t) + ")");
  var all = habitsOf("day").concat(habitsOf("week"));
  if(!all.length){ L.push("Es sind noch keine Gewohnheiten angelegt."); return L.join("\n"); }
  var days = []; for(var i = 6; i >= 0; i--) days.push(addDays(t, -i));
  var dh = habitsOf("day");
  if(dh.length){
    L.push("", "TAGES-HABITS (letzte 7 Tage " + days.map(function(d){ return WD[wday(d) - 1]; }).join(" ") + "; ✓ erfüllt, Zahl = Teilfortschritt, · = nichts)");
    dh.forEach(function(h){
      var cells = days.map(function(d){ var n = countOf(h.id, d); return n >= h.target ? "✓" : n > 0 ? String(n) : "·"; }).join(" ");
      L.push("- " + h.title + " [" + targetLabel(h) + "]: " + cells + " | Serie " + streak(h) + ", Rekord " + bestStreak(h) + ", 7 T " + pct(rate(h, 7)) + ", 30 T " + pct(rate(h, 30)) + (h.reminder.on ? ", Erinnerung " + h.reminder.time : ""));
    });
  }
  var wh = habitsOf("week");
  if(wh.length){
    L.push("", "WOCHEN-HABITS (letzte 6 Wochen, Anzahl/Ziel)");
    wh.forEach(function(h){
      var ks = periodKeys(h, t, 6);
      L.push("- " + h.title + " [" + targetLabel(h) + "]: " + ks.map(function(k){ return "KW" + kw(k.slice(1)) + " " + countOf(h.id, k) + "/" + h.target; }).join(", ") + " | Serie " + streak(h) + " Wo., 4 Wo. " + pct(rate(h, 4)) + ", 12 Wo. " + pct(rate(h, 12)));
    });
  }
  var o = openHabits(t);
  L.push("", "Heute noch offen: " + (o.day.length ? o.day.map(function(h){ return h.title; }).join(", ") : "nichts") + (o.week.length ? " · diese Woche offen: " + o.week.map(function(h){ return h.title; }).join(", ") : ""));
  if(S.settings.dailyTimes.length) L.push("Tageserinnerungen: " + S.settings.dailyTimes.join(", ") + " Uhr");
  return L.join("\n");
}
function copyMentor(){
  var txt = mentorText();
  function fallback(){
    openSheet('<div class="shtop"><h2>Für Mentor kopieren</h2><button class="tb" data-action="close" aria-label="Schließen">' + uic("x") + '</button></div><p class="note">Text markieren, kopieren und beim Mentor einfügen.</p><textarea class="inp ta" readonly>' + esc(txt) + '</textarea><div class="actions"><span class="grow"></span><button class="btn" data-action="close">Fertig</button></div>');
    var ta = document.querySelector(".ta"); if(ta){ ta.focus(); ta.select(); }
  }
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(txt).then(function(){ toast("Zusammenfassung kopiert. Einfach beim Mentor einfügen."); }, fallback); }
  else fallback();
}
function exportPayload(){ return {app:"entwicklung-ziele", schema:SCHEMA, exportedAt:Date.now(), habits:S.habits, counts:S.counts, settings:S.settings}; }
function exportName(){ var d = new Date(); return "habits-" + toISO(d) + "-" + pad(d.getHours()) + pad(d.getMinutes()) + ".json"; }
function doExport(){
  download(exportName(), JSON.stringify(exportPayload(), null, 1), "application/json");
  S.meta.lastExport = Date.now(); save(); toast("Export gespeichert."); settingsSheet();
}
function doShare(){
  var file = new File([JSON.stringify(exportPayload(), null, 1)], exportName(), {type:"application/json"});
  if(navigator.canShare && navigator.canShare({files:[file]})) navigator.share({files:[file], title:"Habits – Export"}).then(function(){ S.meta.lastExport = Date.now(); save(); settingsSheet(); }, function(){});
  else doExport();
}
function mergeData(inc){
  inc = migrate(JSON.parse(JSON.stringify(inc)));
  var st = {neu:0, aktualisiert:0, unveraendert:0};
  ["habits", "counts"].forEach(function(c){
    var ix = {}; S[c].forEach(function(r, i){ ix[r.id] = i; });
    inc[c].forEach(function(r){
      if(!(r.id in ix)){ S[c].push(r); ix[r.id] = S[c].length - 1; st.neu++; }
      else if((r.updatedAt || 0) > (S[c][ix[r.id]].updatedAt || 0)){ S[c][ix[r.id]] = r; st.aktualisiert++; }
      else st.unveraendert++;
    });
  });
  if((inc.settings.updatedAt || 0) > (S.settings.updatedAt || 0)) S.settings = inc.settings;
  S.meta.lastImport = Date.now(); save();
  return st;
}
function doImportFile(file){
  var rd = new FileReader();
  rd.onload = function(){
    try {
      var d = JSON.parse(rd.result);
      if(d.app && d.app !== "entwicklung-ziele") throw new Error("Datei gehört nicht zu dieser App");
      var st = mergeData(d);
      toast("Zusammengeführt: " + st.neu + " neu, " + st.aktualisiert + " aktualisiert, " + st.unveraendert + " unverändert.");
      render(); settingsSheet();
    } catch(e) { toast("Import fehlgeschlagen: " + e.message); }
  };
  rd.readAsText(file);
}
/* ---------- Ziehen & Ablegen (Maus und Touch, Pointer Events) ---------- */
var DRAG = null;
function dragStart(e, grip){
  if(e.button != null && e.button !== 0 && e.pointerType === "mouse") return;
  var row = grip.closest(".hrow"), list = row && row.parentNode; if(!row) return;
  e.preventDefault();
  var r = row.getBoundingClientRect();
  var ph = document.createElement("div"); ph.className = "ph"; ph.style.height = r.height + "px";
  list.insertBefore(ph, row);
  row.classList.add("dragging");
  row.style.width = r.width + "px"; row.style.left = r.left + "px"; row.style.top = r.top + "px";
  DRAG = {row:row, ph:ph, list:list, dy:e.clientY - r.top, id:e.pointerId, grip:grip, y:e.clientY};
  try { grip.setPointerCapture(e.pointerId); } catch(x) {}
  if(navigator.vibrate && e.pointerType === "touch"){ try { navigator.vibrate(10); } catch(x) {} }
}
function dragMove(e){
  if(!DRAG || e.pointerId !== DRAG.id) return;
  e.preventDefault();
  var y = e.clientY; DRAG.y = y;
  DRAG.row.style.top = (y - DRAG.dy) + "px";
  var rows = Array.prototype.filter.call(DRAG.list.children, function(c){ return c.classList.contains("hrow") && c !== DRAG.row; });
  var before = null;
  for(var i = 0; i < rows.length; i++){ var b = rows[i].getBoundingClientRect(); if(y < b.top + b.height / 2){ before = rows[i]; break; } }
  if(before){ if(DRAG.ph.nextSibling !== before) DRAG.list.insertBefore(DRAG.ph, before); }
  else if(DRAG.list.lastChild !== DRAG.ph) DRAG.list.appendChild(DRAG.ph);
  if(y < 70) window.scrollBy(0, -10); else if(y > window.innerHeight - 70) window.scrollBy(0, 10);
}
function dragEnd(e){
  if(!DRAG || (e && e.pointerId !== DRAG.id)) return;
  var d = DRAG; DRAG = null;
  d.list.insertBefore(d.row, d.ph); d.ph.remove();
  d.row.classList.remove("dragging"); d.row.style.width = d.row.style.left = d.row.style.top = "";
  var ids = Array.prototype.map.call(d.list.querySelectorAll(".hrow"), function(r){ return r.getAttribute("data-hid"); });
  reorder(ids);
}
function reorder(ids){
  var now = Date.now(), changed = false;
  ids.forEach(function(id, i){ var h = habitById(id); if(h && h.order !== i + 1){ h.order = i + 1; h.updatedAt = now; changed = true; } });
  if(changed){ save(); }
  render();
}
/* ---------- Ereignisse ---------- */
var LP = null, LPT = null;
function onCellTap(btn){
  var id = btn.getAttribute("data-id"), key = btn.getAttribute("data-key");
  if(LP && LP.cell === id + key && Date.now() - LP.t < 900){ LP = null; return; }
  var h = habitById(id); var n = tapCount(id, key);
  if(h && n === h.target && navigator.vibrate){ try { navigator.vibrate(15); } catch(x) {} }
  if(!UI.hintSeen){ UI.hintSeen = 1; saveUI(); }
  render();
}
function longPress(btn){
  var id = btn.getAttribute("data-id"), key = btn.getAttribute("data-key");
  LP = {cell:id + key, t:Date.now()};
  decCount(id, key); render();
  if(navigator.vibrate){ try { navigator.vibrate(25); } catch(x) {} }
}
function act(a, el){
  switch(a){
    case "new": habitSheet(null, UI.mode); break;
    case "edit": habitSheet(el.getAttribute("data-id")); break;
    case "close": closeSheet(); render(); break;
    case "save": saveHabit(); break;
    case "del": deleteHabit(); break;
    case "t-inc": readHabitForm(); M.d.target = Math.min(99, M.d.target + 1); drawHabitSheet(); break;
    case "t-dec": readHabitForm(); M.d.target = Math.max(1, M.d.target - 1); drawHabitSheet(); break;
    case "ics-habit": readHabitForm(); download("erinnerung-" + slug(M.d.title || "habit") + ".ics", icsHabit(M.d), "text/calendar"); toast("Kalender-Datei geladen. Öffne sie, um den Termin zu übernehmen."); break;
    case "ics-daily": download("tageserinnerung.ics", icsDaily(), "text/calendar"); toast("Kalender-Datei geladen. Öffne sie, um die Termine zu übernehmen."); break;
    case "remind": remindSheet(); break;
    case "dtime-add": addDailyTime(); break;
    case "dtime-del": setDailyTimes(S.settings.dailyTimes.filter(function(t){ return t !== el.getAttribute("data-t"); })); remindSheet(); break;
    case "ask-notify": askNotify(function(){ if(M && M.type === "remind") remindSheet(); }); break;
    case "test-notify": notify({key:"test", title:"Test", body:"So sehen Erinnerungen aus."}); break;
    case "settings": settingsSheet(); break;
    case "stats": UI.view = UI.view === "stats" ? "list" : "stats"; render(); window.scrollTo(0, 0); break;
    case "mentor": copyMentor(); break;
    case "export": doExport(); break;
    case "share": doShare(); break;
    case "import": $("#file").click(); break;
  }
}
function bind(){
  document.addEventListener("click", function(e){
    var t = e.target;
    var cell = t.closest("[data-cell]"); if(cell){ onCellTap(cell); return; }
    var m = t.closest("[data-mode]"); if(m){ UI.mode = m.getAttribute("data-mode"); saveUI(); render(); return; }
    if(M && M.type === "habit"){
      var k = t.closest("[data-fkind]"); if(k){ readHabitForm(); M.d.kind = k.getAttribute("data-fkind"); drawHabitSheet(); return; }
      var c = t.closest("[data-color]"); if(c){ readHabitForm(); M.d.color = c.getAttribute("data-color"); drawHabitSheet(); return; }
      var i = t.closest("[data-icon]"); if(i){ readHabitForm(); M.d.icon = i.getAttribute("data-icon"); drawHabitSheet(); return; }
      var w = t.closest("[data-wd]"); if(w){ readHabitForm(); var x = +w.getAttribute("data-wd"), ds = M.d.reminder.days, p = ds.indexOf(x); if(p >= 0){ if(ds.length > 1) ds.splice(p, 1); } else ds.push(x); ds.sort(); drawHabitSheet(); return; }
    }
    var th = t.closest("[data-theme-set]"); if(th){ UI.theme = th.getAttribute("data-theme-set"); saveUI(); applyTheme(); settingsSheet(); return; }
    var a = t.closest("[data-action]"); if(a){ act(a.getAttribute("data-action"), a); return; }
    if(t.id === "modal"){ closeSheet(); render(); }
  });
  document.addEventListener("change", function(e){
    var t = e.target;
    if(t.id === "f-rem"){ readHabitForm(); M.d.reminder.on = t.checked; if(t.checked) askNotify(); drawHabitSheet(); return; }
    if(t.id === "f-time" || t.id === "f-target"){ readHabitForm(); drawHabitSheet(); return; }
    if(t.hasAttribute && t.hasAttribute("data-dtime")){ var old = t.getAttribute("data-dtime"); if(validTime(t.value)){ setDailyTimes(S.settings.dailyTimes.filter(function(x){ return x !== old; }).concat([t.value])); } remindSheet(); return; }
    if(t.id === "file" && t.files && t.files[0]){ doImportFile(t.files[0]); t.value = ""; }
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && M){ closeSheet(); render(); }
    if(e.key === "Enter" && e.target.id === "f-name"){ e.preventDefault(); saveHabit(); }
  });
  document.addEventListener("pointerdown", function(e){
    var g = e.target.closest("[data-grip]"); if(g){ dragStart(e, g); return; }
    var c = e.target.closest("[data-cell]");
    if(c){ clearTimeout(LPT); var sx = e.clientX, sy = e.clientY; LPT = setTimeout(function(){ LPT = null; longPress(c); }, 550);
      c._lp = {x:sx, y:sy}; }
  });
  document.addEventListener("pointermove", function(e){
    if(DRAG){ dragMove(e); return; }
    if(LPT){ var c = e.target.closest && e.target.closest("[data-cell]"); if(!c || !c._lp || Math.abs(e.clientX - c._lp.x) > 10 || Math.abs(e.clientY - c._lp.y) > 10){ clearTimeout(LPT); LPT = null; } }
  }, {passive:false});
  function up(e){ if(DRAG){ dragEnd(e); } if(LPT){ clearTimeout(LPT); LPT = null; } }
  document.addEventListener("pointerup", up);
  document.addEventListener("pointercancel", function(e){ if(DRAG) dragEnd(e); if(LPT){ clearTimeout(LPT); LPT = null; } });
  document.addEventListener("contextmenu", function(e){
    var c = e.target.closest("[data-cell]"), g = e.target.closest("[data-grip]");
    if(g){ e.preventDefault(); return; }
    if(!c) return;
    e.preventDefault();
    var id = c.getAttribute("data-id") + c.getAttribute("data-key");
    if(LP && LP.cell === id && Date.now() - LP.t < 900) return;
    clearTimeout(LPT); LPT = null; longPress(c);
  });
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) tick(); });
}

/* ---------- PWA ---------- */
function pwa(){
  if(!/^https?:$/.test(location.protocol)) return;
  var l = document.createElement("link"); l.rel = "manifest"; l.href = "manifest.json"; document.head.appendChild(l);
  var ap = document.createElement("link"); ap.rel = "apple-touch-icon"; ap.href = "icon-192.png"; document.head.appendChild(ap);
  var fi = document.createElement("link"); fi.rel = "icon"; fi.type = "image/png"; fi.href = "icon-192.png"; document.head.appendChild(fi);
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").then(function(r){ swReg = r; r.update && r.update(); }, function(){});
    navigator.serviceWorker.ready.then(function(r){ swReg = r; }, function(){});
  }
}

/* ---------- Start ---------- */
function init(){
  load(); bind(); render(); pwa();
  setInterval(tick, 20000); setTimeout(tick, 1500);
}
window.__app = {
  state:function(){ return JSON.parse(JSON.stringify(S)); }, count:countOf, keyFor:function(id, d){ return keyFor(habitById(id), d); }, tap:tapCount,
  openHabits:openHabits, dueReminders:dueReminders, tick:tick, icsDaily:icsDaily, icsHabit:function(id){ return icsHabit(habitById(id)); },
  gcalDaily:function(t){ return gcalLink(dailyEvent(t)); }, mentorText:mentorText, mergeData:mergeData, exportPayload:exportPayload, migrate:migrate,
  streak:function(id){ return streak(habitById(id)); }, rate:function(id, n){ return rate(habitById(id), n); }, reload:function(){ load(); render(); }, ui:function(){ return UI; }
};
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
})();

</script>
